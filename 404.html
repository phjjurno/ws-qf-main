<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지를 찾을 수 없어요 — wsQf</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem('wsqf-theme');
      if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; padding: var(--sp-6); text-align: center; }
    .nf__box { max-width: 420px; }
    .nf__code { font-size: 64px; font-weight: 800; letter-spacing: -0.04em; color: var(--primary); margin: var(--sp-4) 0 var(--sp-2); }
    .nf__title { font-size: 20px; margin-bottom: var(--sp-2); }
    .nf__desc { color: var(--sub); font-size: 14px; margin-bottom: var(--sp-5); }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf__box">
      <a class="brand" href="/" aria-label="wsQf 홈">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 11.5 L10 20.5 L14 13 L18 20.5 L22 11.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="24.5" cy="8" r="2" fill="#fff"/>
          </svg>
        </span>
        <span class="brand__word">ws<b>Qf</b></span>
      </a>
      <p class="nf__code">404</p>
      <h1 class="nf__title">페이지를 찾을 수 없어요</h1>
      <p class="nf__desc">주소가 바뀌었거나 없어진 페이지예요. PDF 합치기·압축·도장·영수증 정리는 홈에서 바로 쓸 수 있어요.</p>
      <a class="btn" href="/">홈으로 가기</a>
    </div>
  </main>
</body>
</html>
