[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"
  # 프론트의 공개 키(Supabase publishable 등)는 실제 비밀이 아니지만,
  # [functions] 활성화 시 Netlify 비밀 스캐너가 오탐해 빌드를 막을 수 있어 끈다.
  SECRETS_SCAN_ENABLED = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 재심사 기간: 실데이터 미연결 상태인 지원금·물가 페이지를 공개에서 제외
# (코드는 리포에 보존 — 인증키 연결되면 이 블록만 지우면 복구됨)
[[redirects]]
  from = "/jiwon/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/mulga/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
